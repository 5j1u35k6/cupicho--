<!DOCTYPE html>

    <script>
        window.addEventListener('error', function(e) {
            var errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'position:fixed; top:0; left:0; width:100%; background:#ef4444; color:white; z-index:9999; padding:10px; font-size:12px; word-break:break-all; font-family:sans-serif;';
            errorDiv.innerText = '系統錯誤: ' + e.message + ' (行數: ' + e.lineno + ')';
            document.body.appendChild(errorDiv);
        });
        window.addEventListener('unhandledrejection', function(e) {
            var errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'position:fixed; top:0; left:0; width:100%; background:#f97316; color:white; z-index:9999; padding:10px; font-size:12px; word-break:break-all; font-family:sans-serif;';
            errorDiv.innerText = '非同步錯誤: ' + (e.reason ? e.reason.message : '未知錯誤');
            document.body.appendChild(errorDiv);
        });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <style>

        /* 螢幕上強制隱藏列印專用區 */
        .print-container {
            display: none !important;
        }

        @media print {
            @page { size: A4; margin: 10mm 5mm; }
            body { 
                background-color: white !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                overflow: visible !important;
            }
            #root { background-color: white !important; }
            .no-print { display: none !important; }
            * { box-shadow: none !important; text-shadow: none !important; }
            
            /* 列印時顯示並設定為網格排版 */
            .print-container { 
                display: grid !important; 
                grid-template-columns: 1fr 1fr !important; 
                gap: 5mm !important; 
                width: 100% !important; 
                background-color: transparent !important; 
                padding: 0 !important; 
                justify-content: center !important;
            }

            .cupicho-tag { 
                border: 1px dashed #ccc !important; 
                break-inside: avoid !important; 
                page-break-inside: avoid !important;
                margin: 0 auto !important; 
                background-color: #2B130F !important; 
                color: #E1C284 !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }
        }
    </style>
</head>

        const BarcodeGenerator = ({ value }) => {
            const barcodeRef = useRef(null);

            useEffect(() => {
                if (barcodeRef.current && value) {
                    try {
                        JsBarcode(barcodeRef.current, value, {
                            format: "CODE128", 
                            width: 1.5,         
                            height: 28,         
                            displayValue: false,
                            background: "transparent",
                            lineColor: "#E1C284",
                            margin: 0
                        });
                    } catch (error) {
                        console.error("Barcode generation failed:", error);
                    }
                }
            }, [value]);

            return <svg ref={barcodeRef} className="max-w-[120%] h-auto origin-bottom-left scale-90 -ml-1"></svg>;
        };

                        }

                    } finally {
                        setIsLoaded(true);
                    }

                loadData();

                try {
                    let config;
                    try {

                    } catch (e) {
                        let cleanStr = configStr.replace(/^(const|var|let)\s+\w+\s*=\s*/, '').trim();

                        config = new Function('return ' + cleanStr)();
                    }

                    }

                    else setTags(tags.filter(t => t.id !== id));
                }
